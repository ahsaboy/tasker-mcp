name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true
      - name: go vet
        working-directory: cli
        run: go vet ./...
      - name: go test
        working-directory: cli
        run: go test ./... -race -count=1
