name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: arm64, suffix: '-aarch64'        }
          - { goos: linux,   goarch: amd64, suffix: '-x86_64'         }
          - { goos: linux,   goarch: arm,   goarm: '7', suffix: '-armv7' }
          - { goos: windows, goarch: amd64, suffix: '-x86_64.exe'     }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true
      - name: build
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p ../dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "../dist/tasker-mcp-server-cli${{ matrix.suffix }}" ./...
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: dist/tasker-mcp-server-cli${{ matrix.suffix }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: list artifacts
        run: ls -la dist/
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/tasker-mcp-server-cli-aarch64
            dist/tasker-mcp-server-cli-x86_64
            dist/tasker-mcp-server-cli-armv7
            dist/tasker-mcp-server-cli-x86_64.exe
            dist/toolDescriptions.json
            dist/mcp_server.prj.xml
